<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BiblioSmart - Mis Libros</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <style>
    body {
      background-color: #f8f9fa;
    }
    .navbar {
      background: linear-gradient(135deg, #563d7c, #8e6cbd) !important;
    }
    .books-container {
      background: white;
      border-radius: 15px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      padding: 2rem;
      margin: 2rem 0;
    }
    .book-card {
      border: 1px solid #dee2e6;
      border-radius: 10px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .book-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
    }
    .star-rating-display {
      color: #ffc107;
      font-size: 1.2rem;
    }
    .status-badge {
      font-size: 0.85rem;
    }
    .empty-state {
      text-align: center;
      padding: 3rem;
      color: #6c757d;
    }
    .empty-state i {
      font-size: 4rem;
      margin-bottom: 1rem;
    }
    .star-rating {
      font-size: 2rem;
      cursor: pointer;
      color: #ddd;
    }
    .star-rating .star {
      transition: color 0.2s;
    }
    .star-rating .star:hover,
    .star-rating .star.active {
      color: #ffc107;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand" href="dashboard.html">
        <i class="bi bi-book"></i> BiblioSmart
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link text-white" href="dashboard.html">
              <i class="bi bi-house"></i> Dashboard
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-white" href="register-book.html">
              <i class="bi bi-plus-circle"></i> Registrar Libro
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-white" href="#" onclick="logout()">
              <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="books-container">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-book-half"></i> Mis Libros Registrados</h2>
        <a href="register-book.html" class="btn btn-primary">
          <i class="bi bi-plus-circle"></i> Agregar Libro
        </a>
      </div>
      
      <div class="mb-3">
        <input type="text" class="form-control" id="searchBooks" placeholder="Buscar libros por título, autor o ISBN...">
      </div>
      
      <div id="booksList">
        <!-- Los libros se cargarán aquí dinámicamente -->
      </div>
    </div>
  </div>

  <!-- Modal para editar libro -->
  <div class="modal fade" id="editBookModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Editar Libro</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="editBookForm">
            <input type="hidden" id="editBookId">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="editTitle" class="form-label">Título del Libro *</label>
                <input type="text" class="form-control" id="editTitle" required>
              </div>
              <div class="col-md-6 mb-3">
                <label for="editAuthor" class="form-label">Autor *</label>
                <input type="text" class="form-control" id="editAuthor" required>
              </div>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="editIsbn" class="form-label">ISBN</label>
                <input type="text" class="form-control" id="editIsbn">
              </div>
              <div class="col-md-6 mb-3">
                <label for="editEntryDate" class="form-label">Fecha de Ingreso *</label>
                <input type="date" class="form-control" id="editEntryDate" required>
              </div>
            </div>
            <div class="mb-3">
              <label for="editReadingStatus" class="form-label">Estado de Lectura *</label>
              <select class="form-select" id="editReadingStatus" required>
                <option value="Por leer">Por leer</option>
                <option value="Leyendo">Leyendo</option>
                <option value="Leído">Leído</option>
                <option value="Abandonado">Abandonado</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Calificación con Estrellas *</label>
              <div class="star-rating" id="editStarRating">
                <span class="star" data-rating="1">☆</span>
                <span class="star" data-rating="2">☆</span>
                <span class="star" data-rating="3">☆</span>
                <span class="star" data-rating="4">☆</span>
                <span class="star" data-rating="5">☆</span>
              </div>
              <input type="hidden" id="editRating" value="0" required>
            </div>
            <div class="mb-3">
              <label for="editReview" class="form-label">Reseña</label>
              <textarea class="form-control" id="editReview" rows="5"></textarea>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary" onclick="saveBookEdit()">Guardar Cambios</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/books.js"></script>
  <script src="js/view-books.js"></script>
</body>
</html>
