<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BiblioSmart - Recomendaciones IA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <style>
    body {
      background-color: #f8f9fa;
    }
    .navbar {
      background: linear-gradient(135deg, #563d7c, #8e6cbd) !important;
    }
    .recommendations-container {
      background: white;
      border-radius: 15px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      padding: 2rem;
      margin: 2rem 0;
    }
    .recommendation-card {
      border: 1px solid #dee2e6;
      border-radius: 10px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .recommendation-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
    }
    .ai-badge {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.85rem;
      display: inline-block;
      margin-bottom: 1rem;
    }
    .loading-spinner {
      text-align: center;
      padding: 3rem;
    }
    .empty-state {
      text-align: center;
      padding: 3rem;
      color: #6c757d;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand" href="dashboard.html">
        <i class="bi bi-book"></i> BiblioSmart
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link text-white" href="dashboard.html">
              <i class="bi bi-house"></i> Dashboard
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-white" href="view-books.html">
              <i class="bi bi-list-ul"></i> Ver Libros
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-white" href="#" onclick="logout()">
              <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="recommendations-container">
      <h2 class="mb-4">
        <i class="bi bi-robot"></i> Recomendaciones por IA
      </h2>
      <p class="text-muted mb-4">
        Basado en tus preferencias literarias y tus libros registrados, aquí tienes recomendaciones personalizadas:
      </p>
      
      <button class="btn btn-primary mb-4" onclick="generateRecommendations()">
        <i class="bi bi-arrow-clockwise"></i> Generar Nuevas Recomendaciones
      </button>
      
      <div id="recommendationsList">
        <div class="loading-spinner">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Cargando...</span>
          </div>
          <p class="mt-3">Generando recomendaciones personalizadas...</p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/books.js"></script>
  <script src="js/recommendations.js"></script>
</body>
</html>
