<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BiblioSmart - Registrar Libro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="js/chatbot.css">
  <style>
    body {
      background-color: #f8f9fa;
    }

    .navbar {
      background: linear-gradient(135deg, #563d7c, #8e6cbd) !important;
    }

    .form-container {
      background: white;
      border-radius: 15px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      padding: 2rem;
      margin: 2rem 0;
    }

    .star-rating {
      font-size: 2rem;
      cursor: pointer;
      color: #ddd;
    }

    .star-rating .star {
      transition: color 0.2s;
    }

    .star-rating .star:hover,
    .star-rating .star.active {
      color: #ffc107;
    }

    .user-info {
      color: white;
    }
  </style>
</head>

<body>
  <nav class="navbar navbar-dark navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand" href="dashboard.html">
        <i class="bi bi-book"></i> BiblioSmart
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link text-white" href="dashboard.html">
              <i class="bi bi-house"></i> Dashboard
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-white" href="view-books.html">
              <i class="bi bi-list-ul"></i> Ver Libros
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-white" href="#" onclick="logout()">
              <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="form-container">
      <h2 class="mb-4"><i class="bi bi-book-plus"></i> Registrar Nuevo Libro</h2>

      <form id="bookForm">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="title" class="form-label">Título del Libro *</label>
            <input type="text" class="form-control" id="title" required>
          </div>
          <div class="col-md-6 mb-3">
            <label for="author" class="form-label">Autor *</label>
            <input type="text" class="form-control" id="author" required>
          </div>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="isbn" class="form-label">ISBN</label>
            <input type="text" class="form-control" id="isbn" placeholder="Ej: 978-84-08-12345-6">
          </div>
          <div class="col-md-6 mb-3">
            <label for="entryDate" class="form-label">Fecha de Ingreso *</label>
            <input type="date" class="form-control" id="entryDate" required>
          </div>
        </div>

        <div class="mb-3">
          <label for="readingStatus" class="form-label">Estado de Lectura *</label>
          <select class="form-select" id="readingStatus" required>
            <option value="">Selecciona un estado</option>
            <option value="Por leer">Por leer</option>
            <option value="Leyendo">Leyendo</option>
            <option value="Leído">Leído</option>
            <option value="Abandonado">Abandonado</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Calificación con Estrellas *</label>
          <div class="star-rating" id="starRating">
            <span class="star" data-rating="1">☆</span>
            <span class="star" data-rating="2">☆</span>
            <span class="star" data-rating="3">☆</span>
            <span class="star" data-rating="4">☆</span>
            <span class="star" data-rating="5">☆</span>
          </div>
          <input type="hidden" id="rating" value="0" required>
          <small class="form-text text-muted">Haz clic en las estrellas para calificar</small>
        </div>

        <div class="mb-3">
          <label for="review" class="form-label">Reseña</label>
          <textarea class="form-control" id="review" rows="5"
            placeholder="Escribe tu reseña sobre el libro..."></textarea>
        </div>

        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
          <a href="dashboard.html" class="btn btn-secondary">Cancelar</a>
          <button type="submit" class="btn btn-primary">
            <i class="bi bi-save"></i> Guardar Libro
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/books.js"></script>
  <script src="js/chatbot.js"></script>
  <script>
    // Establecer fecha actual por defecto
    document.getElementById('entryDate').valueAsDate = new Date();

    // Prellenar formulario si viene de recomendaciones
    document.addEventListener('DOMContentLoaded', function () {
      const params = new URLSearchParams(window.location.search);
      const title = params.get('title');
      const author = params.get('author');

      if (title && author) {
        document.getElementById('title').value = decodeURIComponent(title);
        document.getElementById('author').value = decodeURIComponent(author);
      }
    });

    // Manejar calificación con estrellas
    const stars = document.querySelectorAll('.star');
    const ratingInput = document.getElementById('rating');

    stars.forEach(star => {
      star.addEventListener('click', function () {
        const rating = parseInt(this.getAttribute('data-rating'));
        ratingInput.value = rating;

        stars.forEach((s, index) => {
          if (index < rating) {
            s.classList.add('active');
            s.textContent = '★';
          } else {
            s.classList.remove('active');
            s.textContent = '☆';
          }
        });
      });

      star.addEventListener('mouseenter', function () {
        const rating = parseInt(this.getAttribute('data-rating'));
        stars.forEach((s, index) => {
          if (index < rating) {
            s.style.color = '#ffc107';
          }
        });
      });
    });

    document.getElementById('starRating').addEventListener('mouseleave', function () {
      const currentRating = parseInt(ratingInput.value);
      stars.forEach((s, index) => {
        if (currentRating === 0 || index >= currentRating) {
          s.style.color = '#ddd';
        }
      });
    });
  </script>
</body>

</html>
